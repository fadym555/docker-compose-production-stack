groups:
  - name: stack
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~'5..'}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of API requests are failing
      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency is above 500ms
      - alert: WorkerFailingJobs
        expr: increase(jobs_processed_total{result="error"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: The worker failed at least one job in the last 10 minutes
