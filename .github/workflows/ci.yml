name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:latest < api/Dockerfile
      - name: Lint shell scripts (shellcheck)
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable backup/backup.sh tests/test_stack.sh
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool prom/prometheus:v3.0.1 check rules /m/alerts.yml
          docker run --rm -v "$PWD/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml" -v "$PWD/monitoring/alerts.yml:/etc/prometheus/alerts.yml" --entrypoint promtool prom/prometheus:v3.0.1 check config /etc/prometheus/prometheus.yml
      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool monitoring/grafana/dashboards/stack-overview.json > /dev/null

  scan:
    name: Image vulnerability scan
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t stack-api:ci api
      - name: Trivy (fail on critical)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress stack-api:ci

  e2e:
    name: Stack up & end-to-end tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: Build and start all 8 services
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Service status
        run: docker compose ps
      - name: End-to-end tests
        run: |
          set -a; . ./.env; set +a
          bash tests/test_stack.sh
      - name: Data survives an API restart
        run: |
          docker compose restart api
          docker compose up -d --wait --wait-timeout 90
          curl -fsS http://localhost:8080/notes | grep -q 'shipped from the CI pipeline'
          echo "data persisted across restart"
      - name: Backup is created and can be restored
        run: |
          docker compose restart backup
          sleep 8
          latest=$(docker compose exec -T backup sh -c 'ls -1t /backups/*.sql.gz | head -n1')
          echo "latest backup: $latest"
          docker compose exec -T backup gunzip -c "$latest" > restore.sql
          docker compose exec -T db createdb -U app restore_check
          docker compose exec -T db psql -U app -d restore_check -q -v ON_ERROR_STOP=1 < restore.sql
          count=$(docker compose exec -T db psql -U app -d restore_check -tAc 'select count(*) from notes')
          echo "rows restored from backup: $count"
          test "$count" -ge 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
